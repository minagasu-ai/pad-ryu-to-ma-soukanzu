<style>
/* 夜の継界：墨色の地に勢力ごとの灯り。明朝の見出し＋角ゴシックの本文。全体図は「勢力の区画→人物札→関係の光線」の3層 */
:root{color-scheme:dark;
  --bg:#0b0e15;--bg2:#10141e;--panel:#131824;--card:#1a2131;--line:#283047;
  --ink:#ecebe6;--sub:#98a1b5;--gold:#d8b25a;--cyan:#3fd4ea;
  --display:"Shippori Mincho B1","Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--body)}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding:10px 20px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#151a27,#0f131c)}
h1{font-family:var(--display);font-weight:800;font-size:21px;margin:0;letter-spacing:.08em;color:var(--ink)}
h1::before{content:"";display:inline-block;width:9px;height:9px;margin-right:12px;transform:rotate(45deg) translateY(-2px);background:var(--gold);box-shadow:0 0 12px var(--gold)}
.meta{font-size:11.5px;color:var(--sub);letter-spacing:.04em}
.tabs{display:flex;gap:2px;margin-left:auto;background:#0b0e15;padding:3px;border-radius:10px;border:1px solid var(--line)}
.tabs button{font:inherit;font-size:13px;font-weight:700;border:0;background:transparent;padding:6px 16px;border-radius:7px;cursor:pointer;color:var(--sub);letter-spacing:.04em}
.tabs button:hover{color:var(--ink)}
.tabs button.on{background:var(--gold);color:#17120a}
button:focus-visible,.lc:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{display:flex;height:calc(100% - 56px)}
.view{flex:1;position:relative;min-width:0;display:none;
  background:radial-gradient(1200px 700px at 46% 42%,#172036 0%,transparent 70%),radial-gradient(circle,#232b40 1px,transparent 1.4px) 0 0/26px 26px,var(--bg)}
.view.on{display:block}
svg.map{width:100%;height:100%;display:block;cursor:grab}
svg.map:active{cursor:grabbing}
aside{width:400px;border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:18px 20px 30px;flex:none;scrollbar-color:#333c55 transparent}
.tools{position:absolute;right:14px;top:14px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.btn{font:inherit;font-size:12px;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:rgba(19,24,36,.9);cursor:pointer;color:var(--ink)}
.btn:hover{border-color:var(--gold)}
.btn.on{background:var(--gold);color:#17120a;border-color:var(--gold)}
.legend{position:absolute;left:14px;bottom:14px;background:rgba(15,19,28,.92);border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-size:11.5px;display:flex;flex-wrap:wrap;gap:5px 14px;max-width:calc(100% - 28px);color:var(--ink);backdrop-filter:blur(6px)}
.legend span{display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
.legend span.off{opacity:.3}
.legend i{width:20px;height:3px;border-radius:2px;display:inline-block}
.hint{position:absolute;left:14px;top:14px;font-size:12px;color:var(--sub);background:rgba(15,19,28,.88);border:1px solid var(--line);border-radius:8px;padding:6px 11px}
/* map */
.box .bt{font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.06em}
.card{cursor:pointer;transition:opacity .15s}
.card .bg{fill:var(--card);stroke-width:1.2}
.card:hover .bg{fill:#232c41}
.card .nm{font-family:var(--display);font-weight:800;font-size:14px;fill:var(--ink)}
.card .rl{font-size:10px;fill:var(--sub)}
.card .dr{font-size:9.5px;fill:var(--cyan);font-weight:500}
.card .bd{font-size:9px;font-weight:700;fill:#fff}
.card.mini .nm{font-size:11.5px;font-weight:600;font-family:var(--body)}
.card.dead .bg{stroke-dasharray:4 3}
.card.sel .bg{stroke-width:2.4;fill:#26304a}
.edge path{fill:none}
.edge path.halo{stroke:var(--bg);stroke-width:6;stroke-opacity:.9}
.edge path.ln{stroke-width:1.7;stroke-opacity:.9;stroke-linecap:round}
.elab rect{fill:#0d111a;stroke-width:1;stroke-opacity:.75}
.elab text{font-size:10.5px;font-weight:500;fill:#dfe2ea}
.edge,.elab{transition:opacity .15s}
.fade{opacity:.1}
.hl path.ln{stroke-width:3;stroke-opacity:1;filter:drop-shadow(0 0 5px currentColor)}
/* panel */
aside h2{font-family:var(--display);font-size:24px;margin:8px 0 4px;letter-spacing:.04em}
aside h3{font-size:12px;margin:20px 0 8px;color:var(--gold);letter-spacing:.14em;font-weight:700;display:flex;align-items:center;gap:10px}
aside h3::after{content:"";flex:1;height:1px;background:var(--line)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;color:#0b0e15;margin:2px 4px 2px 0}
.tag.bdg{color:#fff}
.bio p{font-size:13.5px;line-height:1.9;margin:0 0 10px;color:#d9dbe2;text-align:justify}
.status{background:rgba(216,178,90,.09);border-left:3px solid var(--gold);padding:10px 12px;font-size:13px;line-height:1.75;border-radius:0 8px 8px 0;color:#efe7d3}
.rg{margin-top:10px}
.rg h4{font-size:12px;margin:14px 0 4px;display:flex;align-items:center;gap:7px;color:var(--ink)}
.rg h4 i{width:16px;height:3px;border-radius:2px}
.rel{padding:6px 0 6px 20px;border-bottom:1px solid #1e2536;font-size:13px;line-height:1.6;color:#cfd3dc}
.rel a,.lnk{font-weight:700;cursor:pointer;color:var(--ink);text-decoration:underline;text-decoration-color:#55607a;text-underline-offset:3px}
.rel a:hover,.lnk:hover{text-decoration-color:var(--gold)}
.sub{font-size:12.5px;line-height:1.6;color:var(--sub)}
.sum p,.sum li{font-size:13px;line-height:1.85;color:#d9dbe2}
.sum b{color:var(--ink)}
.sum ul{padding-left:18px;margin:4px 0}
.sum li::marker{color:var(--gold)}
.src{font-size:11.5px;color:var(--sub);line-height:1.7;margin-top:22px}
.src a{color:var(--gold)}
/* list */
#list{overflow:auto;padding:20px 24px 40px;height:100%}
.fsec{margin-bottom:26px}
.fsec h3{font-family:var(--display);font-size:17px;margin:0 0 10px;display:flex;align-items:center;gap:9px;letter-spacing:.05em}
.fsec h3 b{width:10px;height:10px;transform:rotate(45deg)}
.fsec h3 small{font-family:var(--body);font-weight:400;color:var(--sub);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:9px}
.lc{background:var(--card);border:1px solid var(--line);border-left-width:3px;border-radius:9px;padding:9px 11px;cursor:pointer}
.lc:hover{background:#232c41}
.lc b{font-size:14px;font-family:var(--display)}
.lc div{font-size:11.5px;color:var(--sub);line-height:1.55;margin-top:2px}
.lc .ex{color:#c9cdd8;margin-top:5px}
.lc .st{color:#e3c88a}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:860px){
  header{padding:8px 12px} h1{font-size:17px} .meta{display:none}
  .tabs{margin-left:0;width:100%} .tabs button{flex:1;padding:6px 4px;font-size:12px}
  .wrap{flex-direction:column;height:auto}
  .view{height:70vh;flex:none} #list{height:auto}
  aside{width:100%;border-left:none;border-top:1px solid var(--line)}
  .legend{display:none}
  .hint{display:none}
}
</style>
</head>
<body>
<header>
  <h1>『龍と魔の物語』相関図</h1>
  <div class="meta">公式ストーリー全章／絆の章【信条と持てる全て】（2025/07/08更新分）時点</div>
  <div class="tabs"><button data-v="map" class="on">全体相関図</button><button data-v="focus">人物でたどる</button><button data-v="list">人物一覧</button></div>
</header>
<div class="wrap">
  <div class="view on" id="v-map">
    <svg class="map" id="map"></svg>
    <div class="hint">カードに触れると関係を強調。タップで固定、もう一度で「人物でたどる」へ</div>
    <div class="tools"><button class="btn" id="fitBtn">全体を表示</button></div>
    <div class="legend" id="legend"></div>
  </div>
  <div class="view" id="v-focus">
    <svg class="map" id="focus"></svg>

"ティフォン":"世界の中心にあった故郷を、突如現れた二体の獣魔に滅ぼされた双子の兄。白獣魔イルムが天空を、黒獣魔ズオーが地上を支配するなか、瀕死の弟ガディウスを連れて脱出した。悪魔を討ち弟を護りたいという願いが、闇の鎖で封じられていた滅雷龍ドルヴァを目覚めさせ、契約して「黒龍契士」となる。\n遊楽魔アーミルの館で転界の龍喚士ツバキ・スミレ・カエデを解放し、灼冥魔スカーレットとの戦いでは機操士シャリテ＝マキナに救われた。海龍王ヴォルスーンの試練でドルヴァと互いを認め合って魂の融合を完全なものにし（滅法の黒龍契士）、故郷でズオーと決戦。弟の乱入による三つ巴の末、次元の狭間に呑まれたが、ツバキたちとミルの助けで帰還した。\n以後は、イルム打倒に加え、龍に蝕まれていく弟を救い出すことも旅の目的になる。青龍契士リューネに協力を求めて天城へ乗り込み、左手に集めた邪滅の力でイルムの魔導を砕いて弟を救った。\n龍の章では、記憶を失った少女リィを保護して「お兄ちゃん」と慕われ、邪滅の力で呪いの進行を抑えた。キリから、仇が悪魔か龍かの差しかなく自分たちは同類だと突きつけられて迷う。しかしエンラの言葉で、自分の出発点は復讐心だけでなく、唯一の肉親を守りたい気持ちだったと思い直した。スオウからは、ドルヴァがかつて父の契約龍だったこと、戦いの黒幕がその父であることを知らされた。それでも戦いを降りず天城へ向かい、大広間でキリに「共に考えよう」と手を差し伸べた。\n絆の章では、弟と力を合わせてイルムの魔法壁を砕き、父レーヴェンと対峙する。契約を解かれ龍も消えた後、願いを手放せるのかというズオーの問いかけと、弟が初めて見せた弱気を受け止め、力がなくても抗い続けると腹を決めた。",
"ガディウス":"ティフォンの双子の弟。獣魔襲来の際にイルムから瀕死の重傷を負った。小さい頃から兄の背中を追い、同じ双子なのに及ばない自分が悔しかった。兄を超え獣魔を倒すため、封印の地で浄雷龍セディンの力を我がものにするつもりで契約を申し出て、「赤龍契士」となる。契約の条件は、願いが叶ったとき成熟した魂をセディンに喰わせることだった。\n洗脳されていたカンナとサツキを解放して力を得る。インディゴの氷の牢に閉じ込められたところを機操士ピュール＝マキナに救われ、頑龍王ガイノウトには、敵方に回ったサリアを連れ帰ると請け合い、試練では自分の魂を半ばまでセディンに明け渡した（忘我の赤龍契士）。決戦の地ではセディンに意識を奪われて兄とズオーの戦いに乱入し、次元の狭間へ。死神の娘グリーダとの勝負に勝って脱出した。\nその後、天城でイルムの魔導により暴走する。兄とリューネに救われ、深層心理でセディンと向き合って、互いを認め合う形で再契約した（魔浄の雷龍契士）。龍の章では、カンナの護符のおかげでひとり天城に残り、6号に襲われたサリアを庇う。魔浄の拳で殴り飛ばした一撃が、6号の記憶が揺らぐきっかけになった。その後はサリアやカンナとイルミナの書庫に身を隠す。絆の章では兄の剣に炎を重ねてイルムの魔法壁を砕き、黒炎に追われる6号の前に立って攻撃を弾き、母を救えと励ました。龍が消えた後は、セディンを忘れていく恐怖を兄にだけ打ち明けている。",
"サリア":"前世の少女は、親友デウス＝エクス＝マキナを守るために煌兎龍フラグレムと契約したものの、果たせないまま世を去った。その契約を引き継いで生まれた「生まれながらの龍契士」で、生まれた時から龍の爪を宿す。\n頑龍王ガイノウトの庇護のもと、龍契士の力は世界の均衡を守るために使うものだと言い聞かされて育った。そばにいた絡繰り人形デウス＝エクス＝マキナが唯一の友だった。\n覚醒したデウスがズオーに敗れて半壊すると、ガイノウトが止めるのも聞かずイルムのもとへ乗り込む。デウスの核を人質に取られ、「完全なる魔導書」で修復するという取引に応じて敵に協力した。天城では居場所がなく、イルミナの書庫に身を寄せる。そこで渡された魔導書が開いた異空間で、騎龍王ノルディスの試練を越えた。フラグレムからデウスの翼と盾を授かり、核を取り戻すため天城へ戻る。\n絆の章では、カンナやイルミナと共に打開策の「神の書」を携えて駆けつけた。",
"リューネ":"母が龍と交わした契約を引き継いで生まれ、龍の爪を持って生まれた青龍契士。海龍王ヴォルスーンの庇護のもとで育ったが、自分で望んだわけではない力を、どう使えばいいのか分からずにいた。ズオーの手が育ての親の領域に伸びると、戦場へ向かう。\n契約龍の鮫龍トアに導かれ、母を知る青年（リクウ）から母の昔話を聞いて、自身の「還爪」の意味を知る。還爪は、すべての魂をあるべき姿へ還す唯一無二の力。ティフォンに弟の救出を頼まれたことで、この力を必要とする人のために役立てようと心が定まり、幻龍王ゼローグ∞の試練を越えた。\n次元の魔術師チェスターから魔導姫ゴエティアの鍵を受け取り、ティフォンと天城へ。還爪でガディウスとセディンの結びつきを断った。\n龍の章では、紅葉山でディステルの龍に還爪の力を奪われる。しかし龍王の龍玉を通じてヴォルスーンの力がトアの傷を癒し、新たな還爪を得た。スオウにはリクウの龍酒を対価に、ティフォンを天城へ連れてくるよう頼んでいる。大広間では、その還爪でリィの魂を呪われる以前の姿に戻した。\n絆の章では契約解除で還爪も「ただの人の手」に戻る。レーヴェンが全員の契約を解いた術は、ディステルが奪った彼女の還爪と「龍の書」を組み合わせたものだった。",
"シルヴィ":"生まれる前、脆く消えかけた魂だった。その「生きたい」という願いを風龍王リンシアに見初められ、眷属の嵐鷹龍クァージェと契約させられて、生まれながらの龍契士になった。龍の翼を宿し、大斧を振るう。リンシアが退屈しのぎにそばに置き、振り回しながら育てた。\n生真面目で務めをきちんと果たすが、思っていることがすぐ顔に出る。リンシアがイルムの誘いに乗って姿を消すと、他の龍王の命で連れ戻す旅に出た。道中で遭遇したアーミルの誘惑をはねつけたが、以来ずっと付きまとわれている。\n風の神殿でリンシアと戦い、その翼を斬り裂く。リンシアの羽根が映した記憶から、龍王が悪魔の誘いに乗ったのは、シルヴィを自分の手元から自由にするためでもあったと知った。力を譲り受け、イルムの背後にいる者が龍族の消滅を望んでいるという情報を託され、天城へ向かう。\n龍の章ではターディスと交戦し、リクウたちに同行した。龍王の龍玉を受け取った際には、クァージェが契約を続けると決めるやり取りを耳にした。聖域ではリクウと共にミルとカエデを助け、大広間では重傷のキリとエンラを守って戦った。",
"龍王たち":"継界のバランスを保つ五体の龍。海のヴォルスーン、雷天のガイノウト、風のリンシア、騎龍王ノルディス、幻龍王ゼローグ∞。リューネ、サリア、シルヴィは龍王に育てられた。\n遥か昔、魔導書で世界を作り変えようとしたレーヴェンを、龍喚士と共に世界の敵と断じた。青龍契士の還爪で彼の契約を解除させ、異空間に封じる。双頭の雷龍も浄雷と滅雷に分けて封印し、その守護を巫女リーベに命じた。後に、封じたはずのレーヴェンが彼女に接触していると知ると、彼女の排除を決めた。リクウやディステルが龍王に複雑な感情や恨みを抱くのは、この過去のため。\nスオウとは「友」として対等に接している。絆の章では龍喚士の長たちとレーヴェンの再封印に動き、聖域へ進軍したが、影に飲み込まれて継界のすべての龍とともに姿を消した。",
"ヴォルスーン":"大弯の海龍王。リューネを庇護して育てた。黒獣魔ズオーの侵略が自身の領域にまで及び、リューネが戦場へ向かうきっかけになった。ティフォンには試練を与え、ドルヴァとの魂の融合へ導いた。リンシアと共に細工師チュアンの「龍玉」に力を込め、スオウを通してリューネに届けさせている。",
"ガイノウト":"雷天の頑龍王。サリアを庇護し、龍契士の力は世界の均衡のためにあると教え込んだ育ての親。眷属フラグレムはサリアの契約龍でもある。イルムに協力したサリアを案じてガディウスに止めるよう頼み、試練を与えた。",
"リンシア":"玻璃の風龍王。退屈と変化のなさを嫌い、均衡を保つことだけが役目という龍王の在り方に納得していなかった。気まぐれで眷属を振り回す。消えかけた魂を救うためにクァージェを送り込み、シルヴィを「生まれながらの龍契士」にした張本人でもある。\nイルムの計画とその背後の存在に危うさを感じながらも、使命を捨てて単身天城へ向かい、龍王の魔力を提供した。実際は内側から情報を探っていた。追ってきたシルヴィと戦うことを「龍王の試練」とし、力と、魔導書を命じた者の目的（龍の消滅）を彼女に託した。",
"ノルディス":"解放の騎龍王。イルミナの魔導書が開いた異空間でサリアと出会い、力を求める彼女に試練を課した。防戦一方でも諦めないサリアに、フラグレムが呼応して新たな力が開花した。",
"ゼローグ∞":"黒天の幻龍王。還爪で誰かを救いたいと答えたリューネに、トアが開いた道の先で試練を与えた。リューネはこれに打ち勝ち、還爪を思いどおりに扱えるようになった。",
"ミル":"時を操る力を持つ時の契約者で、界の聖域の守護者。龍と応じた（龍応を果たした）契約者であるため、イルムに魂を狙われている。\n次元の狭間に呑まれたティフォンを救うため、ツバキたちに試練を課して転界逢龍陣の奥義へ導いた。さらに継界への帰還の道を開き、弟を救う手がかりとして、溟鮫龍と契約した者（リューネ）を訪ねるようティフォンに勧めた。\nその後、イルムの魔龍の軍勢に聖域を襲われ、龍の章ではラジョアに襲われ、魔力のほとんどを一瞬で奪われる。イルムは彼女の魔力を、足りない龍覚印の代わりにするつもりだった。カエデに守られ、リクウが契約龍の命の力を魔力に替えて分け与えたおかげで、時を操る力の暴走は避けられた。\nかつて龍王たちと共にレーヴェンを異空間に封じた当人でもある。襲ってきた影の気配が彼のものだと気付き、聖域を動けない自分に代わって彼を止めてほしいと、リクウに後を託した。絆の章でレーヴェンが拠点にしたのが、この聖域。",
"ツバキ":"転界の緋空を守る大倭世の龍喚士。前世では、大事な人を助けたい一心で荒れる海に身を投じた少女だった。海神（ワダツミ）に魂を気に入られてツバキとして転生し、前世の記憶を抱えたまま、海の底に留め置かれる身となった。修行を抜け出してくるスミレとの友情に支えられて解放され、荒ぶる龍の魂を鎮める。龍神ヤマトタケル＝ドラゴンの名を喚び、二度と離れないと誓って共に緋空を守るようになった。\n獣魔の侵略ではズオーに結界を破られ、アーミルの館に封じられた。救い出してくれたティフォンに転界の術で力を授け、彼が次元の狭間に呑まれると、ミルの試練を経て奥義で次元に大穴を開け救出した。聖域に押し寄せた魔龍の軍勢も一掃している。絆の章では、リクウの手紙を受けて天城の外に集結。カンナの合図にあわせ、龍神の力を借りた全力の結界で、黒雷から一同を守り抜いた。転界の召喚術は継界のものと仕組みが異なるため、レーヴェンの術の影響を受けなかった。",
"スミレ":"転界の藍海を守る大倭世の龍喚士。天真爛漫な性格。藍海司ワダツミ＝ドラゴンのもとで修行していたが、度々抜け出しては海の底に縛られた少女ツバキに会いに行き、外の世界の話を聞いて友情を深めた。龍神を説得してツバキを解放した恩人でもある。\nズオーに捕らえられアーミルの館に封じられたが、ティフォンに救われる。その後は転界の術で彼を強化し、奥義でワダツミ＝ドラゴンを喚んで次元の狭間から救い出した。聖域ではミルを守るため魔封じの結界を張った。",
"カエデ":"転界の碧地を守る大倭世の龍喚士。碧地司ヤマツミ＝ドラゴンを師と仰いで修行していた。ツバキとスミレが先に一人前と認められるなか、ひとりだけ龍神の名を喚べずにいた。力を得て何をしたいのかという師の問いにも、答えを出せずにいた。\nティフォンに救われてから自分のしたいことを考えるようになり、彼の救出では迷わず龍神の名を喚んで奥義を成功させた。龍の章では聖域でラジョアからミルを守り、傷を負う。天城からの撤退では、転界の仲間と結界で生存者を守った。しかし勾玉に大きなヒビが入り、龍神の再召喚はできなくなった。絆の章では、悔やむより次の一手に目を向けようと仲間に促している。妹はモミジ。",
"カンナ":"転界を創った光と闇の龍神に仕える日龍喚士。サツキと共に外界からの侵入者から龍神を守っていたが、イルムに攻撃を無効化され、洗脳されて配下にされた。\nインディゴの命でガディウスを襲うが、セディンの浄雷の炎で洗脳が解ける。恩返しに転界術を施し、ガディウスとセディンの繋がりを深めた。力を取り戻すと光の護符と羽衣で姿を隠して天城の最深部へ潜入し、「人の書」「魔の書」創造の一部始終を目撃した。冥界の路を開いて影龍を放ち、仲間に情報を届けている。\n絆の章では、サリア、イルミナと共に打開策を携えて現れた。\n龍の章では天城に潜伏を続け、イルムの転移術からガディウスひとりを護符で守った。絆の章では符を通じて城内の様子を外のツバキ達に伝え、天城崩壊の瞬間に結界を張る合図を出している。",
"サツキ":"光と闇の龍神に仕える月龍喚士。カンナと共にイルムに洗脳され、ガディウスを襲撃した。浄雷の炎で正気に戻ると、恩返しに彼を強化した。\n月の満ち欠けで操る力の属性が変わり、護符で「新月」の姿になると闇龍を放つ。理性的でなくなるため、その姿はあまり見せたくないらしい。天城へ急ぐガディウスに代わって妖精女王ティターニアの足止めを引き受け、闇で包み込んだ。絆の章では、ツバキ達と共に結界で一同を黒雷から守った。",
"モミジ":"転界の碧地で碧地司ヤマツミ＝ドラゴンに仕える龍巫女。カエデの妹。ズオーに姉と龍喚士たちが継界へ攫われた後も、龍神から力の一部を託され、留守の碧地を守護している。",
"イルム":"いくつもの世界を渡り歩く別格の悪魔で、「白獣魔」「狂幻魔」と呼ばれる。「完全なる魔導書」を創り上げることだけを役目として生き、その正体はレーヴェンが創造した悪魔だった。\n世界の中心でその場のすべてを滅ぼして天空を支配し、天城を拠点にする。転界ではカンナとサツキを洗脳した。半壊したデウスの核を人質にサリアを、退屈を嫌うリンシアを誘って味方に付けた。妖精や魔導姫たちに白紙の魔導書を配り、伝承や強い魔力を記録させた。集めた材料から「人の書」「魔の書」を仕上げ、最後の一冊のためにミルの魂も狙う。複製として生んだイルミナは「失敗作」と呼んで放置した。\n絆の章でついに魔導書を完成させ、ロミアと6号の魔力を吸い上げ、次元の穴を開いてレーヴェンを帰還させる。しかしズオーに斬り伏せられた。最期に、自分にも願いがあり、それは生みの主の望みを果たすことだったと悟り、「おかあさん」と呼ぶイルミナに見送られて眠りについた。",
"イルミナ":"イルムが自身の複製を作るために生んだ魔導書から誕生した幻魔。魔導書を無から創れないために出来損ない扱いされ、インディゴに天城の隅へ追いやられた。イルムが捨てた魔導書を集めて書庫を作り、誰も来ない場所で長い時を過ごしていた。\n居場所を失ったサリアを受け入れ、魔導書を手渡す。目的は、失敗作とされた本の力をイルムに見せつけることだった。メルが盗み出したイルムの破棄本も改編していく。\n絆の章では、その改編の成果である「神の書」を携えて現れた。友だちのロミアと力を合わせて制御し、完全なる魔導書の術式の一つを打ち消す。「失敗作」の自分にもできることがあったと知り、倒れたイルムを「おかあさん」と呼んで見送った。今はリクウと共にレーヴェンの術を分析している。\nロミアとは以前からの友だちで、彼女にもらったぬいぐるみを机に置いて大事にしていた。「神の書」の土台は、プラリネが届けたウィジャスの白紙の書。創造主イルムを超えることになる改編に迷ったが、捕らわれたロミアを思って引き受けた。",
"インディゴ":"冥魔姉妹の妹で、刻薄の凍冥魔。イルムを敬愛し、主の邪魔になる者を排除しようとする。洗脳したカンナとサツキをガディウスに差し向けたが失敗。自ら立ちはだかり、イルムから譲り受けた魔導書で彼を氷の牢に閉じ込めた。しかし機操士姉妹に牢を破られて敗北する。イルミナを天城の隅に追いやったのも彼女。龍の章では天城でリクウ達を魔龍ごと氷牢に閉じ込めて時間を稼ごうとしたが、突然現れたスオウに一太刀で斬り倒された。",
"ティターニア":"妖精女王。イルムのために龍の力や記録を集めていた。天城を目指すガディウスと対峙したが、援軍のサツキに足止めされ、新月の闇に包まれた。",
"メル":"狂面の魔公爵ダンタリオンが自分の影から生み出した人形で、幻魔を調べるための道具。美しい顔に感情を出すことはなく、影を渡って次元の狭間にも現れる。\n予定調和を嫌う主の命で「イレギュラー」を起こすため、イルムが破棄した魔導書を盗んでイルミナに渡した。同じ頃、次元の狭間で泣いていたロミアをズオーのもとへ導いている。顛末には関心を示さず主のもとへ戻った。",
"ゴエティア":"魔導姫。イルミナが魔導書を書き換えたことで縛りが解けると、狂幻魔への意趣返しとして天城への扉を開く鍵を生み出した。鍵は継承者である次元の魔術師チェスターを通じてティフォンとリューネに渡り、ティフォンたちの天城突入を可能にした。",
"アルス＝ノウァ":"魔導姫。イルミナに魔導書を書き換えられた後、自身の継承者ウィジャスの望みに応えて、神界へ通じる扉を開いた。魔導書の完成を阻むための助力で、後にウィジャスは神々の力を込めた白紙の書をイルミナへ届けさせている。",
"チェスター":"次元の魔術師で、魔導姫ゴエティアの継承者。パズルピースの大穴から現れ、ゴエティアの指示で天城への鍵をティフォンとリューネに届けた。",
"ウィジャス":"時空の魔術師。魔導姫アルス＝ノウァの魔導書の所持者で、継承者にあたる。彼の願いを叶えるため、アルス＝ノウァは神界へ続く扉を開いた。\n龍の章では、神々の力を込めた白紙の書をプラリネに託してイルミナへ届けさせる。まだ下地にすぎず、書き換えて仕上げなければ完全なる魔導書には対抗できない、という言づてが添えられていた。",
"ズオー":"いくつもの世界を渡り歩く別格の悪魔で、「黒獣魔」。真の姿は隻眼の「獄幻魔」。イルムと同じくレーヴェンに創造された悪魔で、イルムとは破壊と創造の対になる存在。\n悪魔の本能に従い「奈落」を渇望し、世界を壊して奈落へ落とすことを目的としていた。世界の中心の地上を支配し、転界からはツバキたち3人を攫って館に封じた。覚醒デウスを半壊させる一方で、ティフォンの力は認め、真の姿で全力の決戦に応じる。三つ巴の末に次元の狭間へ呑まれ、瘴気を得られず衰弱したが、娘ロミアに魔力を分けられて復活した。居城に戻ると、壊すこと以外で初めて、あの龍契士と再び刃を交えたいという望みを抱く。そこへディステルとラジョアが現れ、「鍵」の一族の生き残りだったロミアを攫われた。重圧に膝をつきながら放った一太刀がラジョアの仮面を割っている。リクウと利害が一致して天城へ乗り込み、創造主の意に背いた者として裁断者ロシェに狙われた。\n絆の章では、ラジョアに苦戦するティフォンを救い、ロミアを取り戻すよう要求する。ロミアが託したぬいぐるみの魂の欠片を受け取ってイルムを斬り伏せ、「ロミアを守る」ことを自分の存在意義と定めた。なぜ創造主に背くのかと問うイルムには、自分が何のために在るかは自分で定めると刃で応えた。龍が消えた後は、力を制限されていない悪魔として、ロミアや配下、ダンタリオンの軍勢と聖域へ向かった。勝ち目がなくても行くのかと問うティフォンには、お前こそ願いを捨てられるのかと問い返している。",
"ロミア":"ズオーが滅ぼした世界で、ただ一人生き残っていた幼子。ズオーに拾われ、血と名を与えられた。故郷を滅ぼした元凶と知りながら「お父様」と慕っている。スカーレットやアーミルら悪魔たちに囲まれ、黒獣魔の一団で姫のように育った。\n黒獣魔に最も近い魂を持ち、力が強すぎて暴走することもあった。ズオーそっくりの意志を持つ人形（ぬいぐるみ）を友達としていつも抱えている。父の失踪を知ると、止めるスカーレットを振り払い、自ら次元に穴を開けて狭間へ飛び込んだ。メルに導かれて父と再会し、魔力を分け与えた。\n実は、あらゆる空間を開く力を血で受け継ぐ「鍵」の一族の生き残り。その力を、レーヴェンが封じられた異空間を開くために狙われ、龍の章で居城からディステルとラジョアに攫われた。\n絆の章では、イルムに光球へ閉じ込められて魔力を奪われる。救出後はイルミナと手を重ねて「神の書」を制御し、ぬいぐるみの魂を父に託した。今は父と共に聖域へ向かう。",
"スカーレット":"冥魔姉妹の姉で、闊達の灼冥魔。ズオーの腹心で、呪縛を受ける代わりに一定の自由行動を認められている。おっとりした気質だが、城の世話役としてロミアを見守る。\nズオーの命で魔の神殿にティフォンを誘い込み、冥魔獣と共に追い詰めたが、機操士姉妹の襲来で敗れた。主の失踪後は、呪縛が消えていないことから生存を確信し、アーミルに捜索を命じる。家出するロミアには手が届かなかった。天城の戦いでは負傷し、ハイレンの治療を受けている。ロミアからは「スカーレット姉様」と慕われる。天城ではアーミルと共に、ロシェを道連れにする覚悟でズオーを先へ進ませた。黒棘に貫かれて力尽きかけたところをヴァレリア達に救われている。",
"アーミル":"ズオーの呪縛によって強大な魔力を得た「幻獣魔」。幻術を使う。軽薄な性格で、気に入った相手を常にそばに置きたがり、敵であっても口説きにかかる。\nズオーの命でツバキたちを封じた館を守っていたが、ティフォンに顔に傷を負わされて逃走し、龍喚士たちは解放された。主の捜索中に出会ったシルヴィを一目で気に入り、断られても付きまとい続けている。聖域でミルの話を聞き、「鍵」の一族がロミアではないかと最初に気付いたのは彼。リクウを連れて居城へ急ぎ、天城ではスカーレットとロシェの足止めに身を投げ出した。龍が消えた後も、沈むシルヴィにいつもの軽口を残して聖域へ発っている。",
"レーヴェン":"ティフォンとガディウスの父にあたる人物で、すべての黒幕。「宿意／龍滅の堕龍契士」。\n遥か昔、人と龍が争っていた時代に、故郷に伝わる双頭の雷龍と恐れずに言葉を交わし、友になった。人と龍が互いを受け入れる世界を夢見て、その願いを認めた雷龍と契約して故郷を飛び出す。旅の中で、龍に憧れるリクウ、悪魔の血が混じるディステル、夢に賛同したプラリネが仲間に加わった。命を狙われ続けていたディステルを救い、仲間の証としてリクウとディステルには龍の力を抑える龍牙を、プラリネには花を贈っている。機械仕掛けの友のために戦う少女や、転界から来た盲目の少年、聖域の守り手である少女とその龍にも出会い、龍王の試練も越えて世界の仕組みを知っていく。\nリクウとディステルが、世界を組み替えうる魔導書の理論をまとめ上げると、それを使って、人と龍が並んで暮らせるよう世界を組み替えようとした。しかし龍王と龍喚士は彼を世界の敵と断じる。ディステルと共に戦ったが、龍王の命を受けた当時の青龍契士の還爪で契約を強制解除され、龍王とミルの手で異空間に封じられた。雷龍は浄雷と滅雷に分断され、故郷の両端に鎖で縛られた。\n数百年後、ダンタリオンが異空間に干渉してくる。レーヴェンは悪魔の術で自分の「影」を切り離して器とし、故郷へ戻った。そこで雷龍の封印を守る巫女リーベに出会う。最初は情報を得るために近づいたが、やがて心惹かれ、相思相愛になった。龍王たちが彼女の排除を決めると、わずかに残った雷龍の力を与えて守り抜く。しかし力を使い果たし、再び閉じられた空間へ戻るしかなかった。友も理想も居場所も、愛する者との時間も奪われ、願いは、龍のいない世界を創ることへとねじ曲がっていく。\nその後は影ラジョアを使ってイルムとズオーを生み、龍を憎む者たちを集めて「完全なる魔導書」を作らせた。天城でついに帰還を果たす。帰還後は、6号を黒雷で撃ち、ディステルをレイゲンごと砕いて、彼がリューネから奪っていた還爪の力ごと奪った。イルミナとロミアの「神の書」に「魔の書」を打ち消され、魔導書が不完全になっても「関係ない」と止まらない。奪った還爪と「龍の書」を組み合わせて全員の契約を強制解除し、召喚も封じた。“鬼”の姿のスオウに一太刀を浴びると、黒雷で天城ごと貫いて去る。その後、聖域でラジョアの核に力を注ぎ、継界のすべての龍を影で飲み込んだ。\nリーベの声が聞こえた気がしても歩みは止めない。彼の言う「龍なき世界」は、リーベのような心優しい人が縛られずに暮らせたはずの世界、という意味も持っている。",
"ラジョア":"「霊龍契士」。レーヴェンがダンタリオンの術で切り離した自身の「影」で、龍のいない世界の実現を合言葉にする。異空間から動けないレーヴェンの代わりに、イルムとズオーの創造や、キリたち「龍を狩る者」の手引きに使われた。\n仮面で顔を隠し、ほとんど言葉を発しない。龍の章では聖域でミルの魔力を奪い、カエデに退けられる。ターディスとヴェルドの戦いを止めた「影」も、ディステルと共にロミアを攫ったのも彼。その際ズオーの一太刀で仮面が割れ、その素顔を見たリクウは、恐れていた相手だったことを思い知る。大広間ではティフォンを狙った闇の一閃で、庇ったキリを貫いている。絆の章ではティフォンたちの行く手を影の刃で阻んだ。本体が影（闇そのもの）のため、攻撃が通じない。6号の暴走を抑える術をかけていたのも彼。現在は聖域でレーヴェンから魔導書の力を注がれ、龍を飲み込む影を生み出した。",
"ロシェ":"代々龍喚士を出してきた家の生まれで、周囲に決められるまま龍喚士になった「断龍喚士」。継界にも龍にも関心がなく、意志を無視される世界を嫌っていた。ヴァレリアが最初期に育てた弟子のひとりで、自分をちゃんと見てくれたプラリネを唯一の親友と慕っていた。\nプラリネが共存の夢を追ってレーヴェンたちの旅に加わると決めたとき、彼女は「嫌」と拒んで引き留めようとした。しかしプラリネは笑顔でひとり旅立つ。自分は彼女の一番ではなかったのだと思い込み、恨みを膨らませていたところへ、「あの人」が現れ、力を貸せば一番にすると手を差し伸べた。以来、彼の意に沿わないものを処分する“裁断者”を名乗る。鋏で空間を切り裂き、黒棘と異形の魔物を操る。\n龍の章では、創造主の意図から外れたズオー（「黒ニャンコ」と呼ぶ）を狙い、ロミアのぬいぐるみを囮にした。足止めに出たスカーレットとアーミルを退けたところへ、プラリネとヴァレリア一門が追いつく。プラリネに刃を突き立てようとして届かず、無理に連れて行かず好きに生きてほしかっただけだという本心を聞いて刃を落とし、その手を取った。憎まれ口をひとつ残して気を失い、ハイレンの処置で命を取り留めている。プラリネは、気持ちが伝わるまで離れないと決めている。",
"ターディス":"ヴェルドの兄で、「蛮龍契士」。自分を縛っていた茨龍を倒し、強引に契約して支配下に置いた。自由奔放な性格で、看守の一族である弟に捕らえられ、地下牢に囚われていた。\n契約龍は、その牢で自分を縛っていた茨龍オヌ。救い出した男の誘いに乗ったのは、強い相手と戦える場が増えるからにすぎない。龍喚士ウォレスを倒して第七の龍覚印を奪い、シルヴィとの戦いを楽しんだ。シルヴィとの戦いにヴェルドが割り込むと、まだ相手にならないと笑う。影（ラジョア）に呼び戻されると、続きは天城でと誘って去った。天城では、一族の牢獄の鍵で力を解放した弟と死闘を演じ、水龍に貫かれて敗れる。自分を見上げるばかりだった幼い弟の姿を思い浮かべ、満足して倒れた。ハイレンの処置で命は取り留めている。",
"リィ":"森の神殿で謎の男に龍殺しの呪いをかけられ、記憶を失った少女。「恐龍契士」。影の龍ガランダスと契約し、「家族」になりたいと願った。呪いが発動すると相手を選ばず龍に襲いかかってしまうので、多くの龍から敵視されている。\n倒れていたところをティフォンに助けられ、「お兄ちゃん」と慕って行動を共にする。ガランダスの元主人ラシオスとの戦いで呪いに支配され、ガランダスを傷つけてしまう。しかし最後は自分の声を取り戻し、ガランダスと一緒にいたいと涙ながらに訴えた。ガランダスを「ガーさん」と呼ぶ。伝説の星海では守護者アムネルから第八の龍覚印・天を奪ったが、激流でキリとはぐれていた。\nキリに連れ戻された後、天城の大広間でクーリアに無理やり目覚めさせられ、呪いのまま敵味方なく龍を攻撃する。ラシオスに、そばに龍がいるはずだと叱られてガランダスの名を呼び、ティフォンの邪滅の力とリューネの還爪で呪いから解放された。\n絆の章では屋敷で療養中。花冠を編みながら、それを誰に渡したのかを思い出せなくなっていた。",
"クーリア":"龍を嫌いながら、龍を引き寄せてしまう体質の「妖龍契士」。龍のいない世界を創る集団に誘われて加わり、龍喚士エナから第九の龍覚印を奪った。\nシャゼルが寵愛していた闇龍モルムと契約し、冷たく扱って従わせている。天城でモルムを取り戻しに来たシャゼルと対決。モルムが、実はクーリアの内面に憧れてそばにいたと明かした。迷子のプラリネを天城まで案内したこともある。物事を愛らしいか醜いかの二つでしか見ず、龍をその醜い側の筆頭に置いている。\n大広間ではリィの呪いを利用して混戦を作り、レーヴェン帰還までの時間を稼いだ。シャゼルとの戦いの中で、初めてモルムの名を呼んでいる。現在はヴァレリアの屋敷の地下牢。何を嫌っていたのかを忘れつつあり、「龍なき世界」が現実になった今、その顔は晴れやかではない。",
"キリ":"村長の家の長女だったが、村と家族を「七体の龍」に奪われた。「虚龍契士」。仇の一体である「暴食」の大罪龍マジェを右腕に縛り付けて支配し、龍の力そのものは嫌いながら目的のための道具として使う。龍のいない世界に命を懸けられるかと問う男に導かれ、集団に加わった。\n龍喚士グラトから第八の龍覚印・海を奪う。マジェを欲しがるエンラには、記憶を消したところで起きた事実は変わらず、痛みは自分で背負っていくほかないと言い返して退けた。リィを人質に取る形で連れ戻し、ティフォンには、仇の種類が違うだけで自分たちは同じことをしているのだと言い放った。彼女によれば、龍は龍喚士の始祖が初めて召喚した、継界に本来いなかった存在だという。\n天城の大広間で再びティフォンと戦い、龍を消せばリィが家族を失う、それは自分がされたことと同じではないかと問われて揺らぐ。一緒に別の道を探そうと言われて泣いた直後、彼を狙ったラジョアの一閃から庇って貫かれた。エンラとハイレンの治療で命を取り留めたが、龍の記憶が薄れ、何を憎んでいたのかを忘れつつある。",
"6号（アルトゥラ）":"イデアルが、自身の片目の魔力と召喚龍ヴァンドの体の一部をもとに生み出し、我が子として育てた少年。本当の名はアルトゥラ。龍ヴァンドを父のように慕っていた。館が襲撃された際、イデアルは彼を救うため禁術で強制的に龍と契約させたが、少年は暴走する。\nその後は牢に囚われて番号で呼ばれ、龍と龍喚士への憎しみを抱いた。解放した男（レーヴェン）に従い「荒龍契士」として龍喚士ディアラから第五の龍覚印を奪う。天城ではサリアを襲い、ガディウスに殴り飛ばされたのをきっかけに記憶が揺らぎ始める。追ってきたイデアルと戦ううち、ヴァンドが二人の名を叫んで暴走。クーリアに回収され、ラジョアに再び制御術をかけられた。神をも屠る龍と龍喚士の両方を源に持つ彼の魔力は、「鍵」で開けた異空間の穴を固定するために必要とされていた。\n絆の章では、ラジョアの術が解けて力が暴走。母イデアルが彼を庇い、レーヴェンの黒雷に貫かれる。「大好きよ」という言葉で記憶を取り戻し、ヴァンドと完全な契約を結んで、母を守るためレーヴェンに立ち向かった。しかし契約の強制解除で再び生死の境をさまよい、ハイレンの治療を受けている。",
"リーベ":"龍王の命で、雷龍（ドルヴァとセディン）の封印を一生かけて見守ることになった巫女。「巫龍喚士」。役目のために封印の地を一歩も離れられなかったが、外の世界や龍への憧れを失わなかった。村では距離を置かれがちだった分、誰かと言葉を交わせることを何より喜ぶ。物腰は柔らかく少しとぼけたところもあるが、芯は強い。\n影の器で故郷に戻ってきたレーヴェンと知り合い、彼の語る旅の話に惹かれて、やがて互いに想い合うようになる。これを知った龍王たちが彼女を取り除こうとしたとき、レーヴェンは残っていた雷龍の力を彼女に移して守った。その力は彼女の身に宿っていた命へ流れ込み、双子が生まれる。名前を付けたのは彼女である。\n大きすぎる力を受けたせいで長くは生きられなかったが、残された時間のすべてを息子たちに注いだ。亡くなった今も、魂は封印の洞窟に留まっている。自由を奪われても龍を憎まず前を向いていた彼女は、レーヴェンの憎しみを和らげられたただ一人の相手だった。絆の章では、彼の選択を問いただすような声として一度だけ現れる。",
"リクウ":"龍のことを知り尽くしたいという願いから、生命を司る龍リョウエンと契約した「穏龍契士」。紅葉山に暮らす学者。若き日のレーヴェンの親友で、人と龍の共存という理想に共感し、ディステルやプラリネと継界を旅した。\nディステルと二人で「完全なる魔導書」を創るための理論を組み上げたが、創書の中止を説得して聞き入れられなかった。過去の経緯から、龍王や龍喚士とは距離を置いている。\n龍の章では、旅の途中で出会ったリューネの母の縁でリューネに還爪を教え、ニースにも協力する。聖域ではミルを回復させた。絆の章では帰還したレーヴェンを冷静に見つめ、切り捨てられたディステルを抱き止めた。今はレーヴェンの居場所を突き止め、イルミナと共に、術はまだ発動しきっていないと分析している。\n旅の仲間の証としてレーヴェンから贈られた龍牙を、今も身につけている。リョウエンの生命力でどんな傷もすぐ癒える体質だったが、契約解除で失った。スオウには頭が上がらない。ロミアが「鍵」だと知ると、アーミルと共に獄幻魔の居城へ向かい、ズオー達と利害の一致で手を組んだ。レーヴェンの再封印という龍王たちの決定にも、ほかに止める手立てがないとして反対していない。",
"ディステル":"悪魔と人の血を引く「謎龍契士」。かつてリクウたちと継界を旅した仲間のひとり。冷ややかで、目的を果たすためなら何でもする。旅を共にした青年（レーヴェン）を慕い、その望みを実現したい一心で、強力な龍と契約を結んだ。\nリクウとは犬猿の仲だが、共に「完全なる魔導書」の理論と創書法を築いた。レーヴェンと共に世界を作り変えようとして龍王と龍喚士に阻まれ、彼と同じく長く異空間に封じられた。数百年後、仮面の悪魔（ダンタリオン）に解放され、レーヴェンを継界へ戻すため動いてきた。契約龍の不形の龍レイゲンは他の生命力を奪って身を保つ龍で、その性質は契約者にも移り、ディステル自身も他者から命の力を得なければ身体が崩れていく。紅葉山ではリューネの還爪の力を奪った。首の装飾品はレーヴェンに贈られた宝物（龍牙）で、レイゲンの影響を和らげる。ロミアが「鍵」の一族の生き残りと知ると、ラジョアと共に居城から攫った。人工の契約龍の研究もしており、後にレーヴェンが放った暴走龍（ジィルクロム）はその研究にあったもの。\n絆の章では、リクウと旅の頃と変わらない言い合いを演じ、止めたい友には君も入っていると、頭突きとともに告げられる。レーヴェンの帰還に歓喜し、暴走した6号を排除しようとした。しかし、ダンタリオンに本当の願いが仲間と過ごした「あの頃」を取り戻すことだったと暴かれ、レーヴェンにレイゲンごと砕かれる。「用は済んだ」と切り捨てられ、伸ばした手を取られないまま意識を失った。その手を握ったのは、世界で一番嫌いな友リクウだった。ハイレンは「まだ間に合う」と治療にあたっている。",
"プラリネ":"ヴァレリアの一番弟子で、師を「教官」と慕う「伝龍喚士」。相棒の龍グライザーを駆る。数百年前に創設された直属部隊の隊長候補だったが、組織の束縛を嫌って断った。\nかつてレーヴェン、リクウ、ディステルと共に継界を旅し、人と龍の共存という理想に共感していた。ディステルを「ディスくん」、リクウを「リッくん」と呼び、レーヴェンから贈られた花を肩に飾っている。\n親友ロシェとは、この旅に出るときに別れたきりだった。ロシェの「嫌」を尊重してひとりで旅立ったことが、彼女の目には見捨てられたと映っていた。龍の章では、天城へ向かう途中で迷子になり、敵のクーリアに道案内を頼む。時空の魔術師ウィジャスから預かった白紙の書をイルミナに届けた後、ロシェを見つけ出した。喉元の刃を素手で握って謝り、一番の友はずっとロシェだったと伝える。師が討つと言っても諦めず、最後はロシェがその手を取った。",
"ソニア＝グラン":"始まりの龍喚士。ニースを隊長とする直属部隊を率い、隊員たちに勅命を下す。ヴァレリアも直属として次代の龍喚士の育成にあたっている。龍覚印を奪った龍契士たちの追跡も、彼女の命によるもの。",
"ニース":"代々優秀な龍喚士を輩出する一族に生まれた、直属部隊の隊長。「劾龍喚士」。数多の龍を召喚して従える実力者で、称えられはしても、周囲からは一線を引かれてきた。その孤独を和らげたのが、個性の強い隊員たちだった。ヴァレリアに師事し、妹ミラからは憧れられている。\n禁術を生んだイデアルを捕縛し、エンラと共に記憶と感情を封印して部隊に戻した。龍覚印を奪った龍契士たちを追い、リューネと共にリクウの協力を得る。天城ではディステルと敵対した。絆の章では、龍が消えて召喚の手段を失った。紅葉山ではダンタリオンと遭遇して仮面を撃ち割り、その忠告で引き返してリクウとリューネをディステルから救った。天城の最奥では、かつての名を知る6号を撃てなかった。",
"エンラ":"直属部隊の「漂龍喚士」で、大罪の名を冠する七体の龍の一体を手に入れたドラゴンコレクター。部隊の最年長。暴食の龍マジェを追うのは、収集のためだけでなく、弟子イデアルの辛い記憶を喰わせて消すためでもあった。しかしキリに、忘れても過去は消えないと一喝されて敗れ、それが自分のエゴだったと認める。迷うティフォンを諭し、重傷のキリを治療したのも彼女。\n絆の章では、記憶の封印に引かれて天城の奥へ向かう弟子を追う。弟子を傷付けられて全ての龍を喚んだが、魔導書の力で一瞬にして消滅させられる。覚悟を決めたところを6号の炎の壁に救われ、重傷者の治療をハイレンに託した。イデアルが持っていた「繋ぐ」力の石を思い出し、それが反撃の手がかりになろうとしている。",
"ヴェルド":"重罪人を閉じ込める牢の番人を代々担う一族の出で、直属部隊の「荊龍喚士」。自由奔放な兄ターディスを嫌い、龍に協力して捕らえた。兄が捨てた一族の役目を継いだのも彼で、幼い頃から兄の背中を見上げ、いつか勝つことを願ってきた。ソニア＝グランの命で、兄が奪った第七の龍覚印の奪還に動く。\n天城で兄と対決し、追い詰められながらも一族に伝わる牢獄の鍵で力を解放した。体力の限界を押して最後の鍵を使い、水龍で兄を貫いた。ターディスは弟の成長を認め、満足して敗れた。\n直属部隊の5番目。召喚龍はゾヌ。牢獄の鍵は、収監した大罪人の力を解放して制御する一族の力で、5号室の竜巻から1号室の激流までを順に開錠した。戦いの最中、兄が自分だけを見ていることに気付いて笑っていた。",
"シャゼル":"龍が大好きで、自分の「庭」で多くの龍を愛でる直属部隊の「庭龍喚士」。中でも寵愛していた闇龍モルムが脱走し、クーリアと契約したことから、彼女を強く憎んでいる。\n天城でクーリアと対決し、次々と龍を呼び出して戦う。モルムが自ら彼女のそばにいたいと語ったことで、取り戻すことは諦め、全力の勝負に切り替えた。大広間では、クーリアを引き受けてニースとリクウを先へ進ませた。",
"ラシオス":"鉄壁の守り手として知られる直属部隊の「衛龍喚士」。部隊長ニースに憧れて召喚を学び、忠義を尽くす。\nかつての相棒ガランダスを、深手を負ったときに戦場から遠ざけた。それを「棄てられた」と受け取ったガランダスは去り、リィの契約龍になっていた。任務として奪還に向かい、呪いに支配されたリィを倒す覚悟まで決める。しかしリィを庇うガランダスの姿と互いの本心を知って剣を降ろし、和解した。家事がまるで駄目で、料理も掃除もガランダスに任せきりだった過去がある。\n天城の大広間では、再び呪いに呑まれたリィの前に立ち、誇りだった戦友がついているのだから独りではないと叱り、目を覚まさせた。絆の章では、リィに野花を届けて花冠を眺めるうち、いつも代わりに助けてくれた戦友の名も声も姿も思い出せなくなる。",
"イデアル":"人と龍が共に生きる世界という両親の夢を継ぐため、エンラに弟子入りした「彩龍喚士」。強大な魔力と膨大な知識を持ち、直属部隊の6番目に選ばれた。両親から受け継いだ秘術で、自分と召喚龍の魔力から新たな命（アルトゥラ）を生み、ヴァンドや弟子マイネと家族のように暮らしていた。\n館が襲撃され、わが子を救うため、悪魔ダンタリオンに囁かれるなか数時間で禁術を編み出す。少年を龍契士にしたが暴走し、自身も傷ついて心が壊れた。ニースに捕縛され、師の手で記憶を封印され、命令に従うだけの龍喚士に戻される。\n龍の章では、第五の龍覚印の奪還と襲撃者（6号）の排除を命じられる。天城で6号と戦ううち、「オ母サン」という声に動けなくなった。\n絆の章では、封印の綻びに導かれて天城の奥へ向かい、暴走する6号を前に戦えなくなる。レーヴェンの黒雷から彼を庇って貫かれ、「大好きよ」と告げた。重体で、治療は難航している。\nかつて「繋ぐ」力を込めた石を媒介に、一時的に龍契士になったことがある。禁術はその石の力と経験をもとに編まれたもの。龍との繋がりを断たれた今、石は再契約・再召喚の手がかりと期待されたが、使い方を知る彼女が話せる状態になく、調査は止まっている。",
"マイネ":"イデアルの館で暮らしながら修行していた見習いの龍喚士、「灯龍喚士」。イデアル、少年（アルトゥラ）、ヴァンドたちを家族として大切にしていた。悪魔ダンタリオンを「よくないもの」と感じ取っていた。禁術の暴走で解き放たれた雷虎龍に立ち向かい、今は主のいない館を守っている。絆の章では、頼まれてイデアルの「繋ぐ」石をヴァレリアの屋敷へ届け、そのままイデアルとアルトゥラの看護を手伝っている。",
"ヴァレリア":"ソニア＝グランのもとで後進の龍喚士を鍛える「師龍喚士」。プラリネ、ロシェ、ニース、ミラ、リエト、ヴィゴらを育てた教官で、ラシオスやヴェルドには少し苦手がられている。悪魔側に付いた教え子ロシェを止めるため、自ら戦線に出た。天城では弟子たちとロシェの魔物を引き受け、プラリネが話せる場を作る。主のために身を賭したスカーレットとアーミルを、その忠義に感じ入って救い、ロシェを自分の手で討つ覚悟もしたが、プラリネに止められた。\nスオウとは腐れ縁の飲み仲間で、かつてユキアカネを迎えに行く彼に力を貸した。絆の章では、屋敷と鍛錬場を敵味方の区別なく療養の場として提供し、ニースやリクウと上層部への報告にも出向いた。思い詰めるスオウを気にかけ、ユキアカネの目を借りるよう勧めた。",
"ミラ":"直属部隊隊長ニースの実の妹で、ヴァレリアの弟子の「援龍喚士」。姉を心配しつつ憧れ、実力差に小さなコンプレックスを抱く。召喚龍は刻射龍イグルド。リエトやヴィゴと共に師の戦場への同行を勝ち取った。天城ではスオウの依頼で、壁越しの遠距離狙撃でリューネたちを援護した。姉と同じく銃を使い、魔眼を解放した超長距離狙撃を得意とする。ロシェ戦では傷ついたグライザーを回復させた。",
"リエト":"ヴァレリアに弟子入りした見習いの「刃龍喚士」。強力な龍を召喚できるが、まだ完全には制御できない。師を強く慕い、いつか隣に立てる存在になることを願う一方、無茶をしがちな師を止める役も担う。",
"ヴィゴ":"ヴァレリアの弟子で見習いの「渦龍喚士」。相棒の水龍をはじめ召喚龍たちとの信頼が厚い。同期のリエトとはライバル同士で、兄弟子にあたる直属部隊の隊員たちに憧れている。",
"スオウ":"転界出身の「鬼龍契士」。転界の監視一族で「不要なもの」を排除する「鬼」に選ばれた。生まれつき盲目で、何にも関心を持たず刃を振るうだけの存在だった。自分の名が色の名前だと知って初めて心が動き、狐龍ユキアカネから瞳を与えられる。一族から逃れて継界へ渡り、のちにヴァレリアの力を借りて捕らわれたユキアカネを迎えに戻り、契約した。\n未来視の瞳を持つが、自分が深入りすると事態が悪い方へ転ぶと視えているため中立を保ち、龍王とも対等な「友」として各地を旅する。施設から救ったアルファとオメガを連れ、龍玉を届け、ティフォンにドルヴァの過去を伝えた。普段は幼子の姿でいることが多い。龍王からの頼まれごとは秘蔵の酒が対価で、リューネの頼み（ティフォンを天城へ運ぶ）もリクウの龍酒で引き受けた。天城ではインディゴを一太刀で斬り、過去視でティフォンがレーヴェンの息子だと見抜いている。避けたい未来を変えられないと悟ってからは、最悪の結末を少しでも和らげる備えとしてハイレンを呼び、ミラを借りて援護した。\n契約解除後も、クロトビから引き継いだ鬼の業によって“鬼”の姿となり、レーヴェンの暴走龍を斬った。レーヴェン本人にも障壁ごと一太刀を浴びせ、その後は迷わず全員での退却を決めて指揮した。屋敷ではユキアカネの目を借りて「最悪の未来」を視るが、駆けつけた目の前でアルファとオメガ、ユキアカネを影に奪われる。視界も閉ざされた喪失の中、神術を使うハイレンに次の行動を問われ、顔を上げた。",
"アルファ":"施設で人工的に生み出され、対のオメガと共に脱走した存在。「滾龍喚士」。人の姿ではオメガを龍として召喚でき、自らも赤く巨大な龍に変わる。最初はスオウを「ニンゲン」と呼んで敵視していたが、救われて行動を共にするようになった。いつも彼を叱り飛ばしつつ、保護者として認めている。臆病なオメガを守ろうとする。絆の章で影に飲まれ、姿を消した。施設に連れ戻されて感情を壊されかけたところを、幼子姿で乗り込んできたスオウに救われた。もとは、外の世界を見たいというオメガの願いを叶えるための脱走だった。",
"オメガ":"アルファと対になって生まれた「昂龍喚士」。龍を喚べる龍で、人の姿ではアルファを召喚し使役する。臆病でよくアルファに叱られる。施設から救い出してくれたスオウを強く敬愛している。天城では龍化したアルファを操って魔龍を一掃した。絆の章で影に飲まれ消失。",
"チュアン":"龍契士にして稀代の細工師、「工龍契士」。契約龍はシージャン。龍王の依頼で、海龍王と風龍王の力を込めた「龍玉」を作り、スオウに託して二人の龍契士のもとへ運ばせた。一人称は「ワガハイ」。額に角があり、スオウを「スー」、ヴァレリアを「ヴァーレ」と呼ぶ。二人に劣らぬ酒好きで、しかも底なしに強い。絆の章ではスオウに呼ばれ、イルミナと共にレーヴェンの術を調べた。精密な術式が何重にも重なっていると舌を巻き、解除や弱体化には年単位の時間がかかるとして解析を断念している。イデアルの「繋ぐ」石に飛びついたものの、契約龍シージャンが影に消えたことで、その調査も止まった。",
"ハイレン":"神界出身で、継界に身を寄せる医師の「療龍喚士」。古代の不思議兵器である粒機龍リヴァートを相棒に連れ、大型医療器具に変形させて治療する。性別には頓着しない。ふらりと現れて治して去るため、死神めいた医者がいると噂になっており、ヘルメットの落書きはスオウが描いたもの。酔い覚ましの薬を買ってくれる常連のスオウとヴァレリアを「先輩」と呼ぶ。\n天城ではスオウに呼ばれ、キリやアーミル、スカーレットら敵味方を問わず治療し、6号の手当ても引き継いだ。奇跡に頼らず人の生命力に寄り添うのが医者としての信条だが、龍の消失でリヴァートを失うと、その信条を曲げて四枚の翼と円環を持つ本来の姿を現し、神術で重傷者の命を繋ぎ止めた。立ち尽くすスオウには、これから何をするつもりかを問いかけた。",
"クロトビ":"狐龍ユキアカネが最初に契約した「鬼」で、「始祖の鬼龍契士」。生まれたときから目が見えなかったが、ユキアカネと視界を分かち合うことで光を得た。転界のため不要な命を刈る役目を担ったが、未来視の暴走で救いのない絶望ばかりを見て心が壊れ、狐面で顔を隠すようになった。彼を救えなかった悔いをユキアカネはずっと抱えており、彼の叶わなかった願いのために鬼を選び続けてきた。スオウはその生まれ変わりのような存在で、夢に彼が現れることもある。",
"ダンタリオン":"人々を操り、混乱を楽しむ「狂面の魔公爵」。無数の仮面をまとい、闇を従えている。予定調和を嫌い、影から生んだ人形メルを使って幻魔を探り、イレギュラーを仕掛けてきた。\nレーヴェンが封じられて数百年後、異空間に干渉して彼に近づいた。彼の行く末を見物したいという理由で話を持ちかけ、影を切り離して外で動く術を与えている。異空間に封じられていたディステルも「仮面の悪魔」として解放した。イデアルに禁術を囁いたのも彼とされる。\n人が願い、砕け散って絶望する顔を仮面に刻むのが愉しみ。龍の章ではニースの銃弾で仮面を割られ、その下は闇そのものだった。誰もがある男の描いた筋をなぞらされているにすぎず、自分はその糸が絡まるところを眺めたいだけだと語る。\n絆の章では、ディステルの本当の願いを暴き、その絶望の顔を仮面に加えられると嘲った。龍が消えた後は、爵位持ちを含む悪魔の軍勢を率いてズオーとロミアへの協力を申し出る。次に味わいたいのは、育ち切ったレーヴェンの絶望だという。過去の所業から、ニースとリクウは彼を信用していない。",
"グリーダ":"界を自由に行き来できる死神の娘。次元の狭間をさまようガディウスと出会い、勝負に負けて彼を継界へ案内した。",
"デウス＝エクス＝マキナ":"龍と人が争っていた遠い昔、龍を殲滅するための神機として創られ、機操士の一族を率いた。戦場で出会った少女（サリアの前世）と友になったが、龍王との戦いで核以外を破壊されて休止し、少女も命を落とした。\nサリアの誕生とともに目覚め、友の生まれ変わりとして見守る。二色の魔の出現で再起動し、機操士三姉妹（シャリテ＝マキナ、ピュール＝マキナら）を差し向けたが、ズオーに敗れて半壊した。核はイルムに抜き取られ、サリアを従わせる人質にされた。",
"ピュール＝マキナ":"デウス＝エクス＝マキナ配下の機操士三姉妹のひとり、「破壊の赤機操士」。インディゴの氷の牢に囚われたガディウスを救い、共に撃退した。その後、頑龍王ガイノウトのもとへ行くよう助言した。",
"シャリテ＝マキナ":"デウス＝エクス＝マキナに古くから仕える機操士三姉妹のひとり。主の命で幻魔配下の殲滅に動き、スカーレットにとどめを刺されかけたティフォンの前に現れて、共に撃退した。その後、力を求める彼に海龍王ヴォルスーンのもとへ行くよう助言している。",
"ディアラ":"天焦の五龍喚士。6号の龍腕に襲われ、第五の龍覚印を奪われた。",
"ウォレス":"変転の七龍喚士。ターディスに敗れ、第七の龍覚印を奪われた。",
"グラト":"干潮の八龍喚士。伝説の星海の守護者。キリに第八の龍覚印・海を奪われた。最後に放った激流が、キリとリィを離ればなれにした。",
"アムネル":"伝説の星海の守護者のひとり。グラトと共に星海を守っていたが、リィに敗れて第八の龍覚印・天を奪われた。",
"エナ":"滅火の九龍喚士。クーリアに第九の龍覚印を奪われた。",
"ドルヴァ":"「滅雷龍」。破滅の雷を司る、冷静で厳格な頭。元はレーヴェンの故郷に伝わる双頭の雷龍の一方で、レーヴェンと友になり、共存の理想が叶うまで共にあると誓って契約した。彼が封じられた後、龍王に浄雷と滅雷に分断され、闇の鎖で封じられる。\n悪魔を討ち弟を護りたいというティフォンの願いに応えて目覚め、願いが叶ったら魂を喰らう条件で契約した。ヴォルスーンの試練を通じてティフォンの芯の強さを認め、外殻を脱いで魂を融合する。ティフォンの魂に触れた時、わずかな懐かしさを感じたという。絆の章ではレーヴェンを昔の契約相手として迎え、変わり果てた彼の願いに悲しげな眼差しを向けた。強制解除で分離した後、影に飲み込まれた。",
"セディン":"「浄雷龍」。浄化の雷を司る、荒々しく粗暴な頭で、双頭の雷龍のもう一方。かつてレーヴェンと契約していた。兄を超えたいガディウスと、魂を喰らう条件で契約する。早く魂を成熟させようと彼の意識を支配し、決戦の地で暴走させた。天城で再び向き合い、ガディウスの意志で願いが叶う姿を見届けたいと、互いを認め合う形で再契約した。絆の章ではドルヴァと共にかつての契約者レーヴェンと再会。現在は影に飲み込まれている。",
"フラグレム":"雷天の頑龍王ガイノウトの眷属、「煌兎龍」。遥か昔、親友デウスを救いたいと願う少女と契約した。少女の死後も契約を破棄せず、眠りについて生まれ変わりのサリアを待った。今度こそ願いが叶うことを望んで見守り、ノルディスの試練ではデウスの翼と盾をサリアに授けた。",
"トア":"溟海の鮫龍、「溟鮫龍」。リューネの母の契約龍で、その契約はリューネに受け継がれた。長年リューネを見守り、還爪を何のために使うのかを問い、答えを得た彼女のために龍王への道を開いた。\nもとはヴォルスーンに選ばれた先代の青龍契士（リューネの母）の契約龍。彼女は龍と人の争いで彷徨う魂を輪廻に還し続けたが、自分自身の願いは最後まで見つからなかった。ディステルの龍に還爪を奪われて魂に傷を負うも、龍玉を通じた海龍王の力で癒え、リューネの歩みを終わりまで見守ると決めて、新たな還爪を生んだ。",
"クァージェ":"風龍王リンシアの眷属、「嵐鷹龍」。消えかけたシルヴィの魂に送り込まれて契約した。リンシアの力を受け継いだシルヴィに呼応し、新たな力を与えた。口は悪いが、龍王に解放を持ちかけられても飛び立ったばかりのシルヴィをまだ放っておけないとして、契約を続けることを選んだ。",
"トルヴィオ":"時の契約者ミルの契約龍。",
"ヤマトタケル＝ドラゴン":"転界の緋空を司る龍神「緋空司」。荒ぶっていた魂をツバキに鎮められ、名を喚ばれて共に緋空を守る。のちに自らの緋剣をツバキに与えた。二人は強い絆で結ばれている。",
"ワダツミ＝ドラゴン":"転界の藍海を司る龍神「藍海司」。スミレを我が子のように育てた。スミレの説得を受け、海底に縛られていたツバキを解放した。",
"ヤマツミ＝ドラゴン":"転界の碧地を司る龍神「碧地司」。カエデの師で、力を得た先に何を望むのかを弟子に問い、その平穏を願う。留守の碧地を守る巫女モミジに力の一部を託している。争いを嫌う龍神だが、聖域でラジョアに気圧されたカエデには一振りの刀を与え、共に戦う意志を示した。",
"リョウエン":"リクウと契約する、生命を司る龍。その力で、聖域で倒れたミルを回復させた。契約者リクウには絶えず生命力を注いでおり、その力は強すぎてレーヴェンの龍牙で抑える必要があった。",
"レイゲン":"ディステルの契約龍「不形の龍」。他者の力を奪い取る能力を持つ一方、契約者の身体を少しずつ朽ちさせる。紅葉山ではリューネの還爪の力を奪った。レーヴェンのオルジュに砕かれ、吸収していた力をすべて奪われた。",

"ジィルクロム":"「偽契の混融龍」。ディステルの研究にあった人工的な契約龍で、どこか機械的な姿をしている。理性もなく本能のまま人を喰らい続ける破滅の龍で、レーヴェンは障害を片付ける手駒として放った。契約を失った一同を追い詰めたが、“鬼”の姿のスオウに腕を斬り落とされ、倒された。",
"ヴァンド":"神をも殺す業を宿す焔龍。イデアルの召喚龍で、イデアルと共にアルトゥラ（6号）を育てた父親のような存在。禁術で6号の契約龍となり、その暴走を自分の意志で抑えてきた。記憶を取り戻した6号と完全な契約を結んだ。強制解除の後は、ボロボロの姿で6号の隣に横たわっていた。",
"オヌ":"ターディスの契約龍の茨龍。龍を狩りすぎた彼の両手を縛め、地下深くに捕らえていた。現れた男の力で苦しんだ隙にターディスに制され、強引に契約させられて支配下に置かれた。",
"ゾヌ":"ヴェルドの召喚龍。水撃と水流で、兄ターディスが得意とする間合いの外から戦う主を支えた。天城の決戦では、牢獄の1号室から解放された激流と融合して巨大な水龍となり、竜巻もろともターディスを撃ち抜いた。",
"マジェ":"仇の七体の龍のうち、「暴食」の名を冠する大罪龍。キリが右腕に縛り付けて支配している。キリがリィを連れ戻す際にガランダスを抑え込み、影へ戻した。",
"ガランダス":"「狂剛龍」。かつてはラシオスの相棒として戦ったが、深手を負って遠ざけられたことを「棄てられた」と恨み、去った。影に潜んでリィと契約し、彼女を家族として守るようになる。ラシオスの真意を知って和解した。現在は影に飲み込まれている。料理が得意で、家事の苦手なラシオスに代わって覚えたもの。リィには「ガーさん」と呼ばれ、彼女を「お嬢」と呼ぶ。",
"モルム":"シャゼルが寵愛していた闇龍。彼女の庭から逃げ出してクーリアと契約し、冷たく扱われながらも従っている。天城での戦いで、実はクーリアの内面に憧れてそばにいたと明かした。",

function shape(m,r){
  const A=P[m[0]],B=P[m[1]];
  const ax=A[0],ay=A[1],bx=B[0],by=B[1];
  if(r&&r.c!==undefined){const c=r.c; return {d:`M${ax},${ay}C${ax},${c} ${bx},${c} ${bx},${by}`,
    pt:t=>{const u=1-t;return [u*u*u*ax+3*u*u*t*ax+3*u*t*t*bx+t*t*t*bx, u*u*u*ay+3*u*u*t*c+3*u*t*t*c+t*t*t*by];}};}
  const q=(r&&r.q)||0; if(!q) return {d:`M${ax},${ay}L${bx},${by}`,pt:t=>[ax+(bx-ax)*t,ay+(by-ay)*t]};
  const mx=(ax+bx)/2,my=(ay+by)/2,dx=bx-ax,dy=by-ay;
  const cx=mx-dy*q, cy=my+dx*q;
  return {d:`M${ax},${ay}Q${cx},${cy} ${bx},${by}`,pt:t=>{const u=1-t;return [u*u*ax+2*u*t*cx+t*t*bx,u*u*ay+2*u*t*cy+t*t*by];}};
}

const cardRects=Object.keys(P).filter(k=>byId[k]).map(id=>{const [w,h]=cardDim(id);return {id,x:P[id][0]-w/2-7,y:P[id][1]-h/2-7,w:w+14,h:h+14};});
function hitCount(sh,a,b){let n=0;for(let i=0;i<=60;i++){const [x,y]=sh.pt(i/60);for(const c of cardRects){if(c.id===a||c.id===b)continue;if(x>c.x&&x<c.x+c.w&&y>c.y&&y<c.y+c.h){n++;break;}}}return n;}
function geo(m){
  const r0=m[4]||0, q0=(r0&&r0.q)||0;
  let best=shape(m,r0), bc=hitCount(best,m[0],m[1])*1000;
  if(bc>0){
    const len=Math.hypot(P[m[1]][0]-P[m[0]][0],P[m[1]][1]-P[m[0]][1]);
    for(let q=-.7;q<=.7001;q+=.035){const sh=shape(m,{q}); const c=hitCount(sh,m[0],m[1])*1000+Math.abs(q-q0)*len*.5+Math.abs(q)*len*.3; if(c<bc){bc=c;best=sh;}}
  }
  const [lx,ly]=best.pt(.5); return {d:best.d,lx,ly};
}

function cardDim(id){const p=P[id],mini=p[5],big=id==="レーヴェン";
  return mini?[Math.max(96,id.length*12+22),26]:[big?158:124,p[3]?58:46];}
(function placeLabels(){
  const obs=Object.keys(P).filter(k=>byId[k]).map(id=>{const [w,h]=cardDim(id);return [P[id][0]-w/2-4,P[id][1]-h/2-10,w+8,h+14];});
  BOX.forEach(([f,x,y])=>obs.push([x+12,y-12,F[f].name.length*15.4+34,24]));
  const ov=(a,b)=>Math.max(0,Math.min(a[0]+a[2],b[0]+b[2])-Math.max(a[0],b[0]))*Math.max(0,Math.min(a[1]+a[3],b[1]+b[3])-Math.max(a[1],b[1]));
  const paths=ePath.select("path").nodes();
  const order=medges.map((d,i)=>[i,paths[i].getTotalLength()]).sort((a,b)=>a[1]-b[1]);
  const samp=paths.map(pp=>{const L=pp.getTotalLength(),a=[];for(let t=0;t<=L;t+=7){const q=pp.getPointAtLength(t);a.push([q.x,q.y]);}return a;});
  const lineHits=(r,i)=>{let n=0;samp.forEach((a,j)=>{if(j===i)return;for(const q of a){if(q[0]>r[0]&&q[0]<r[0]+r[2]&&q[1]>r[1]&&q[1]<r[1]+r[3])n++;}});return n;};
  order.forEach(([i,L])=>{
    const d=medges[i],w=d.l.length*10.6+12,h=18; let best=null; if(!d.l) return;
    const ts=[.5];for(let k=1;k<=14;k++){ts.push(.5+k*.03,.5-k*.03);}
    for(const t of ts){const pt=paths[i].getPointAtLength(L*t);const r=[pt.x-w/2,pt.y-h/2,w,h];
      const sc=obs.reduce((s,o)=>s+ov(r,o),0)*3+lineHits(r,i)*25+Math.abs(t-.5)*40;
      if(!best||sc<best.sc) best={sc,pt,r}; if(sc<=Math.abs(t-.5)*40+1e-6) break;}
    d.lx=best.pt.x; d.ly=best.pt.y; obs.push(best.r);
  });
  eLab.attr("transform",d=>`translate(${d.lx},${d.ly})`);
})();

  used.forEach((t,i)=>{ lg.append("line").attr("x1",0).attr("x2",24).attr("y1",24+i*20).attr("y2",24+i*20).attr("stroke",R[t].color).attr("stroke-width",3).attr("stroke-dasharray",R[t].dash||null);
    lg.append("text").attr("x",30).attr("y",28+i*20).attr("font-size",13).attr("fill","#ecebe6").text(R[t].name); });
  const rc=document.getElementById("v-focus").getBoundingClientRect();
  const fx0=bx0-262, fw=bx1-fx0+20, fh=by1-by0+50;
  const k=Math.min(rc.width/fw,(rc.height-60)/fh,1.25);
  fsvg.call(fzoom.transform,d3.zoomIdentity.translate((rc.width-fw*k)/2-fx0*k,52+(rc.height-60-fh*k)/2-(by0-25)*k).scale(k));
  document.getElementById("fBack").style.visibility=history.length?"visible":"hidden";
}

// ===== 人物一覧 =====
function drawList(){
  const groups={}; nodes.forEach(n=>(groups[n.f]=groups[n.f]||[]).push(n));
  document.getElementById("list").innerHTML=Object.keys(F).filter(k=>groups[k]).map(k=>`
    <div class="fsec"><h3><b style="background:${F[k].color}"></b>${F[k].name}<small>${groups[k].length}人</small></h3>
    <div class="grid">${groups[k].map(n=>`<div class="lc" style="border-left-color:${F[k].color}" data-id="${esc(n.id)}"><b>${esc(n.id)}</b>${P[n.id]&&P[n.id][4]?` <span class="tag bdg" style="background:${BADGE[P[n.id][4]]};font-size:10px;padding:1px 6px">${P[n.id][4]}</span>`:""}<div>${esc(n.title)}</div>${BIO[n.id]?`<div class="ex">${esc(BIO[n.id].split("\n")[0].slice(0,80))}${BIO[n.id].split("\n")[0].length>80?"…":""}</div>`:""}${n.status?`<div class="st">▶ ${esc(n.status)}</div>`:""}</div>`).join("")}</div></div>`).join("");
  document.querySelectorAll(".lc").forEach(el=>el.onclick=()=>openFocus(el.dataset.id));
}

// ===== パネル =====
const panel=document.getElementById("panel");
window.goFocus=id=>openFocus(id);
function renderChar(id){
  const n=byId[id], rels=adj[id];
  const groups={}; rels.forEach(l=>(groups[l.t]=groups[l.t]||[]).push(l));
  const dr=dragonsOf(id);
  panel.innerHTML=`
    <span class="tag" style="background:${F[n.f].color}">${F[n.f].name}</span>${P[id]&&P[id][4]?`<span class="tag bdg" style="background:${BADGE[P[id][4]]}">${P[id][4]}</span>`:""}
    <h2>${esc(id)}</h2>
    <div class="sub">${esc(n.title)}</div>
    ${dr.length&&!n.dragon?`<div style="font-size:12.5px;margin-top:6px;color:var(--cyan)">龍：${dr.map(d=>`<span class="lnk" onclick="goFocus('${esc(d)}')">${esc(d)}</span>`).join("、")}</div>`:""}
    ${BIO[id]?`<h3>人物紹介</h3><div class="bio">${BIO[id].split("\n").map(p=>`<p>${esc(p)}</p>`).join("")}</div>`:""}
    ${n.status?`<h3>いまの状況（絆の章時点）</h3><div class="status">${esc(n.status)}</div>`:""}
    <div style="margin-top:12px"><button class="btn" onclick="goFocus('${esc(id)}')">この人物を中心に関係を見る →</button></div>
    <h3>関係（${rels.length}）</h3>
    <div class="rg">${typeOrder.filter(t=>groups[t]).map(t=>`<h4><i style="background:${R[t].color}"></i>${R[t].name}</h4>${groups[t].map(l=>{const o=l.a===id?l.b:l.a;return `<div class="rel"><a onclick="goFocus('${esc(o)}')">${esc(o)}</a>：${esc(l.l)}</div>`}).join("")}`).join("")}</div>`;
  panel.scrollTop=0;
}
function renderHome(){
  panel.innerHTML=`<div class="sum">
    <h3 style="margin-top:4px">物語のいま（絆の章）</h3>
    <p>白と黒の二体の悪魔を世に放った張本人は、主人公の双子の父にあたる<b>レーヴェン</b>だった。彼の目的は、今の世界を一度壊して創り直すこと、つまり<b>龍のいない世界</b>。</p>
    <ul>
      <li>帰還の鍵は、あらゆる空間を開く一族の生き残り<b>ロミア</b>と、神殺しの龍と契約した<b>6号</b>の魔力。イルムは龍覚印とミルの魔力で「龍の書」を創り、魔導書を完成させた。</li>
      <li>ズオーがイルムを討ち、イルミナとロミアの「神の書」が「魔の書」を打ち消して、魔導書は不完全になった。</li>
      <li>それでもレーヴェンは、ディステルから奪った還爪の力と「龍の書」で<b>全員の龍との契約を強制解除</b>し、召喚も封じた。龍契士は「ただの人」に戻った。</li>
      <li>天城は黒雷で崩壊。転界の龍喚士たちの結界で全員が生き延び、ヴァレリアの屋敷へ撤退した。ロシェ・ターディス・キリ・6号・イデアル・ディステルはハイレンが命を繋いでいる。</li>
      <li>聖域から広がった影が、再封印に向かった龍王を含む<b>継界のすべての龍</b>を飲み込んだ。継界は均衡を失い、天変地異が続く。</li>
      <li>術はまだ発動の途中で、龍の記憶が人々から少しずつ消えている。ラシオスは戦友の名を、サリアは育ての親の名を、シルヴィは寄り添いたかった相手を思い出せない。</li>
      <li>かつての宿敵ズオーとロミアが悪魔の軍勢を率いて聖域へ。主人公たちと同じ敵に向かう局面に入った。ダンタリオンの軍勢も加わる。</li>
      <li>再契約の手がかりはイデアルの「繋ぐ」石だが、調査は頓挫。ティフォンは力がなくても抗い続けると決め、スオウはハイレンに次の一手を問われた。</li>
    </ul>
    <h3>用語</h3>
    <ul>
      <li><b>龍契士</b>：願いを龍に認められて契約し、身体の一部を龍と融合させて戦う者。<b>龍喚士</b>：龍を召喚して共に戦う者。</li>
      <li><b>継界</b>：物語の舞台。五体の龍王と龍喚士が均衡を保つ。<b>転界</b>：鏡合わせの反転世界で、龍神が守る。<b>聖域</b>：すべての界の狭間。</li>
      <li><b>完全なる魔導書</b>：「魔の書」「人の書」「龍の書」から成る、世界を創り変える禁忌の書。理論はリクウとディステルが築いた。</li>
      <li><b>龍覚印</b>：強大な龍を制御する術印。「龍の書」の材料として奪われた。<b>還爪</b>：魂をあるべき姿へ還すリューネの力。</li>
    </ul>
    <h3>見かた</h3>
    <p><b>全体相関図</b>：勢力ごとの枠に主要人物を並べ、物語の軸になる関係だけを線で示しています。カードをタップするとその人の線が強調され、もう一度タップすると下の「人物でたどる」に切り替わります。下の凡例で線の種類を絞り込めます。</p>
    <p><b>人物でたどる</b>：選んだ人物を中心に、直接つながる全員（龍を含む）を放射状に表示。周りの人物どうしにも関係があれば細い曲線で結んでいます。周りの人物をタップすると中心が移ります。</p>
    <p><b>人物一覧</b>：全${nodes.length}人を勢力別に、紹介文の冒頭と現在の状況つきで一覧にしています。</p><p>どの表示でも、人物を選ぶとこの欄に<b>詳しい人物紹介</b>・いまの状況・関係の一覧が出ます。</p>
  </div>
  <div class="src">※ファンが作成した非公式の相関図です。<br>出典：パズル＆ドラゴンズ公式「Story 龍と魔の物語」<br>
    <a href="https://pad.gungho.jp/member/story/index.html">ストーリーTOP（最新話）</a> ／ <a href="https://pad.gungho.jp/member/story/chapter/black.html">黒の章</a> ／ <a href="https://pad.gungho.jp/member/story/chapter/white.html">白の章</a> ／ <a href="https://pad.gungho.jp/member/story/chapter/dragon.html">龍の章</a> ／ <a href="https://pad.gungho.jp/member/story/chapter/kizuna.html">絆の章</a> ／ <a href="https://pad.gungho.jp/member/story/chapter/gossip.html">閑話</a> ／ <a href="https://pad.gungho.jp/member/story/flowchart/index.html">物語の流れ</a> ／ <a href="https://pad.gungho.jp/member/story/glossary/index.html">用語集</a> ／ 各キャラクターpickupページ<br>
    ※閑話のIF回（「いつか過ごすかもしれない」系・学園パロディ）は関係に含めていません。<br>
    ※公式で名前を伏せて書かれた人物（「青年」等）は、本編で明かされた名前に置き換えています。</div>`;
}

// ===== タブ =====
let cur="map";
function show(v){
  cur=v; document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
  document.querySelectorAll(".view").forEach(el=>el.classList.toggle("on",el.id==="v-"+v));
  if(v==="map") requestAnimationFrame(fitMap);
  if(v==="focus") requestAnimationFrame(drawFocus);
}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{show(b.dataset.v); if(b.dataset.v==="focus") renderChar(fCenter); else if(b.dataset.v==="map"){ if(!mapSel) renderHome(); }});
drawList(); renderHome(); applyMap(); requestAnimationFrame(fitMap);
window.addEventListener("resize",()=>{ if(cur==="map") fitMap(); else if(cur==="focus") drawFocus(); });
</script>
